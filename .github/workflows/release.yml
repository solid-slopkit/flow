# Publishes @solid-slopkit/flow to npm and creates a GitHub Release with the changelog as notes (ADR 0001). `pnpm changeset version` sets the version from
# the pending changesets. Commit that, then push a tag named v<version>, e.g.
# `git tag v0.2.0 && git push origin v0.2.0`.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  # npm trusted publishing: the workflow proves its identity with a GitHub OIDC token instead of an npm token.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node from mise.toml; pnpm 12 to match the lockfile.
      - uses: jdx/mise-action@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - run: pnpm install --frozen-lockfile

      - name: Tag matches the package's version, with no changesets left unapplied
        run: |
          version=$(node -e "import('./scripts/packages.mjs').then((m) => console.log(m.sharedVersion()))")
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the package's version $version"
            exit 1
          fi
          if ls .changeset/*.md | grep -v README.md; then
            echo "These changesets are not applied yet: run pnpm changeset version and commit the result"
            exit 1
          fi

      - run: pnpm format:check
      - run: pnpm lint
      # Builds the package and lists the files npm will publish, in the log.
      - run: pnpm release:check
      - run: pnpm -r --filter "./packages/*" typecheck
      # The browser test project runs in Chromium (see packages/flow/vite.config.ts).
      - run: pnpm --filter @solid-slopkit/flow exec playwright install --with-deps chromium
      - run: pnpm test
      # The docs site is a real consumer of the built package: its production build resolves @solid-slopkit/flow
      # through its exports.
      - run: pnpm --filter docs build
      # After the build: the docs' route types (file-routes.d.ts) are generated by it.
      - run: pnpm --filter docs typecheck

      # Publishes the package as built above. A version already on npm is skipped, so a rerun after a later step failed
      # doesn't fail here.
      - name: Publish to npm
        run: node scripts/release-publish.mjs

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release-notes.mjs > release-notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md
