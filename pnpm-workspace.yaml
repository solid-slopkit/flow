packages:
  - packages/*
  - apps/*

# pnpm settings for this project (honored even for a single-package project —
# this file marks the workspace root). The Solid packages release in lockstep
# and templates track them closely; exclude the whole family from any
# minimumReleaseAge policy so fresh Solid releases install immediately.
#
# NOTE: this exclusion is a temporary measure for the Solid 2.0 prerelease
# cycle (frequent lockstep releases where new floors would otherwise fail
# under an age policy). It should be removed once Solid 2.0 is stable —
# at that point a caret range nearly always contains an age-satisfying
# release and the policy can protect these packages like any other.
minimumReleaseAgeExclude:
  - solid-js
  - '@solidjs/*'
  - filesystem-routing
  - '@solid-slopkit/components@0.1.0'

# eslint-plugin-solid (used by oxlint) pulls in @typescript-eslint/* 8.x, which declares
# typescript <6.1. We run TypeScript 7; oxlint parses the code itself, so the solid rules
# still work (verified in M0.07). Drop this once eslint-plugin-solid supports TS 7.
peerDependencyRules:
  allowedVersions:
    '@typescript-eslint/utils>typescript': '7'
    '@typescript-eslint/typescript-estree>typescript': '7'
    '@typescript-eslint/tsconfig-utils>typescript': '7'
    '@typescript-eslint/project-service>typescript': '7'

# One copy of each package however its optional peers resolve. Without it, vite@8 resolved with and without its
# optional `yaml` peer gave two vitest copies, and a setup file importing the other copy registered its matchers a
# second time, breaking `.rejects.toThrow()`.
dedupePeers: true
